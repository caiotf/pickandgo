# PickAndGo: Apache como porta de entrada pública (HTTPS) para o Traefik do k3s
<VirtualHost *:80>
    ServerName pickandgo.atfengenharia.online

    ProxyPreserveHost On
    ProxyPass        / http://10.0.1.19:30080/
    ProxyPassReverse / http://10.0.1.19:30080/
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    ErrorLog  ${APACHE_LOG_DIR}/pickandgo-error.log
    CustomLog ${APACHE_LOG_DIR}/pickandgo-access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =pickandgo.atfengenharia.online
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
