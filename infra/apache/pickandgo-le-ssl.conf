<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pickandgo.atfengenharia.online

    ProxyPreserveHost On
    ProxyPass        / http://10.0.1.19:30080/
    ProxyPassReverse / http://10.0.1.19:30080/
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    ErrorLog  ${APACHE_LOG_DIR}/pickandgo-error.log
    CustomLog ${APACHE_LOG_DIR}/pickandgo-access.log combined

SSLCertificateFile /etc/letsencrypt/live/pickandgo.atfengenharia.online/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/pickandgo.atfengenharia.online/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
