apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickandgo-api
  namespace: pickandgo
  labels:
    app: pickandgo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pickandgo-api
  template:
    metadata:
      labels:
        app: pickandgo-api
    spec:
      containers:
        - name: api
          image: ghcr.io/caiotf/pickandgo-backend:sha-6928a7b
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /WeatherForecast
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /WeatherForecast
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20