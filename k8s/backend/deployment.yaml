apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickandgo-api
  namespace: pickandgo
  labels:
    app: pickandgo-api
  annotations:
    kubernetes.io/change-cause: "sha-a2edb89: prefixo /api e endpoint /health"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pickandgo-api
  template:
    metadata:
      labels:
        app: pickandgo-api
    spec:
      containers:
        - name: api
          image: ghcr.io/caiotf/pickandgo-backend:sha-a2edb89
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20