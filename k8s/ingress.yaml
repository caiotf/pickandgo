apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pickandgo
  namespace: pickandgo
spec:
  ingressClassName: traefik
  rules:
    - host: pickandgo.atfengenharia.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pickandgo-api
                port:
                  name: http